name: Ingest open data

on:
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Full refresh (ignore existing data/incidents.json)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      layer:
        description: 'Ingest a single layer only (leave blank for all)'
        required: false
        default: ''
        type: string
      since_days:
        description: 'How many days back to pull'
        required: false
        default: '30'

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run ingest
        env:
          SODA_APP_TOKEN: ${{ secrets.SODA_APP_TOKEN }}
          INGEST_SINCE_DAYS: ${{ inputs.since_days }}
        run: |
          ARGS=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then ARGS="$ARGS --full-refresh"; fi
          if [ -n "${{ inputs.layer }}" ]; then ARGS="$ARGS --layer=${{ inputs.layer }}"; fi
          pnpm --filter @workspace/scripts run ingest $ARGS

      - name: Commit updated incidents
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/incidents.json
          git diff --staged --quiet || git commit -m "chore: refresh data/incidents.json [skip ci]"
          git push
